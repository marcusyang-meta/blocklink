name: Bug report
description: Tell us what went wrong
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: Blocklink version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: Windows 11 x64 / macOS Apple Silicon / Ubuntu x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error details
      description: Include game and loader versions if relevant. Remove tokens, invitations and personal paths from logs.
