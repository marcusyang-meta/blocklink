name: Headless managed host
on:
  workflow_dispatch:
  pull_request:
    paths: ['crates/**', 'Cargo.*', '.github/workflows/headless.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libdbus-1-dev pkg-config
      - run: cargo test -p blocklink-service --locked
      - run: cargo build -p blocklink-service --release --locked
      - name: Build and smoke test Docker runtime
        run: |
          mkdir docker-context
          cp target/release/blocklink-service docker-context/
          cp crates/blocklink-service/src/managed.Dockerfile docker-context/Dockerfile
          docker build -t blocklink-managed:ci docker-context
          docker run --rm --network none --read-only --cap-drop ALL blocklink-managed:ci --version
          docker run -d --name blocklink-smoke --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 blocklink-managed:ci
          ready=false
          for i in $(seq 1 30); do
            if docker exec blocklink-smoke blocklink-service --root /data --request status; then ready=true; break; fi
            sleep 1
          done
          docker logs blocklink-smoke
          docker rm -f blocklink-smoke
          test "$ready" = true
      - name: Prepare checksummed service
        run: |
          mkdir headless
          cp target/release/blocklink-service headless/blocklink-service-linux-x86_64
          cd headless
          sha256sum blocklink-service-linux-x86_64 > blocklink-service-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: blocklink-headless-linux-x86_64
          path: headless/*
