name: Verify cross-network Minecraft
on:
  workflow_dispatch:
    inputs:
      invitation:
        description: Short-lived isolated test room invitation (revoked after the run)
        required: true
permissions:
  contents: read
  actions: read
jobs:
  client:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libsecret-1-dev libssl-dev pkg-config xvfb libgl1-mesa-dri scrot xdotool
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked -p blocklink-service --lib --no-run
      - name: Join isolated remote world
        env:
          BLOCKLINK_TEST_INVITATION: ${{ inputs.invitation }}
          BLOCKLINK_TEST_RELAY_ONLY: '1'
          BLOCKLINK_TEST_TURN_TLS_ONLY: '1'
          BLOCKLINK_TEST_GAMEPLAY: '1'
        run: |
          echo "::add-mask::$BLOCKLINK_TEST_INVITATION"
          mkdir -p cloud-checks
          set -o pipefail
          xvfb-run -a dbus-run-session -- cargo test --locked -p blocklink-service --lib lobby::world_tests::cloud_client_enters_remote_world -- --exact --ignored --nocapture 2>&1 | tee cloud-checks/multiplayer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cloud-check-multiplayer
          path: cloud-checks/*
