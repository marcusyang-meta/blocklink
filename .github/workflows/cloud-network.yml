name: Diagnose cloud relay connectivity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/cloud-network-check.py
      - uses: actions/upload-artifact@v4
        with:
          name: Network-diagnostics
          path: cloud-checks/network.json
