name: Publish downloadable packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful desktop build workflow run ID
        required: true
      tag:
        description: Release tag (for example v0.1.0-preview.1)
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate build and release
        run: |
          set -eu
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]
          test "$(gh run view "$BUILD_RUN" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$BUILD_RUN" --json name --jq .name)" = 'Build Windows, macOS and Linux'
          test "$(gh run view "$BUILD_RUN" --json headSha --jq .headSha)" = "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          gh release view "$RELEASE_TAG" >/dev/null
      - name: Download native archives
        run: gh run download "$BUILD_RUN" --dir artifacts
      - name: Attach packages and checksums
        shell: python
        run: |
          import json, os, pathlib, subprocess
          tag = os.environ['RELEASE_TAG']
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'assets']))
          existing = {asset['name'] for asset in release['assets']}
          for file in sorted(pathlib.Path('artifacts').rglob('*')):
              if not file.is_file() or not (file.name.startswith('Blocklink-') and file.suffix == '.zip' or file.suffix in ('.sha256', '.AppImage', '.dmg', '.deb')):
                  continue
              # Keep previously published binaries and their matching checksum together.
              if file.name in existing or file.name.removesuffix('.sha256') in existing:
                  print('Keeping existing release asset:', file.name)
                  continue
              subprocess.run(['gh', 'release', 'upload', tag, str(file)], check=True)
